<!-- templates/families/family_settings.html -->
{% extends "base_app.html" %}

{% block title %}家族設定 | おうちカレンダー{% endblock %}
{% block page_title %}私の家族{% endblock %}

{% block content %}
<h1>苗字の設定</h1>

<p>苗字（家族名）：{{ family.name|default:"未設定" }}</p>

<a href="{% url 'families:family_profile_edit' %}">苗字の設定を編集する</a>
{% endblock %}
