<!-- templates/base_flow.html -->
{% extends "base.html" %}

{% block header %}
<header class="app-page-header sticky-header {% block header_class %}{% endblock %}">
  <div>
    {# 左側：← / × など #}
    {% block flow_left %}{% endblock %}

    {# 中央：画面タイトル #}
    <span class="flow-page-title">
      {% block page_title %}{% endblock %}
    </span>

    {# 右側：保存 / 削除 など #}
    {% block flow_right %}{% endblock %}
  </div>
</header>
{% endblock %}
