<!-- templates/children/child_form.html -->
{% extends "base_flow.html" %}

{% block title %}家族設定 | おうちカレンダー{% endblock %}

{% block flow_left %}
<a href="{% url 'children:child_list' %}" aria-label="子どもメンバー画面へ戻る"> × </a>
{% endblock %}

{% block page_title %}
  {% if child %}
  子どもの設定を編集する
  {% else %}
  追加する子どもを入力する
  {% endif %}
{% endblock %}

{% block content %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">保存</button>
  </form>
{% endblock %}
